<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anzeigen-Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e1e6ed;--brand:#1f5fbf;--ok:#1f9d63;--warn:#d98a00;--bad:#d64545;--p1:#7a5af8;--p2:#1f5fbf}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8edf3;--mute:#93a0b0;--line:#2b3340;--brand:#5b9bff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 12px 0 0}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sp{flex:1}
.kpis{display:flex;gap:12px;padding:14px 20px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:140px}
.kpi b{font-size:22px;display:block}.kpi span{color:var(--mute);font-size:12px}
.kpi.bad b{color:var(--bad)}
main{padding:0 20px 30px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:10px;padding:8px;min-height:200px}
.col h3{font-size:12px;margin:4px 6px 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
.phase{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;color:#fff;margin:0 0 6px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--line)}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.blocked{border-left-color:var(--bad)}.card.ok{border-left-color:var(--ok)}
.card .n{font-weight:600}.card .m{color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:5px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;background:var(--line)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad);font-weight:600}
.tag.go{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.chk{display:flex;gap:4px;margin-top:6px}
.chk span{font-size:10px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--mute)}
.chk span.d{background:var(--ok);border-color:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-size:12px}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
td .bar{width:120px;margin:0 0 2px}
.scroll{overflow-x:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(105%);transition:.2s;overflow-y:auto;padding:20px;z-index:10}
#drawer.open{transform:none}
#drawer h2{margin:0 0 2px}#drawer h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;color:var(--mute)}
.x{float:right}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}
.hist{border-left:2px solid var(--line);padding-left:12px;margin:0}
.hist li{list-style:none;margin-bottom:8px;position:relative}.hist li:before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:4px;background:var(--brand)}
textarea{width:100%;min-height:70px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.role{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>📰 Anzeigen-Tracker</h1>
  <select id="fIssue"></select>
  <select id="fStatus"></select>
  <select id="fRole"><option value="">Alle Zuständigen</option><option>Kunde</option><option>Akquise</option><option>Lektorat</option><option>Grafik</option><option>Verlag</option></select>
  <label><input type="checkbox" id="fBlock"> nur Engpässe</label>
  <span class="sp"></span>
  <button id="vK" class="on">Kanban</button><button id="vL">Liste</button>
  <select id="persona" title="Ansicht als"><option>Chefin / Akquise</option><option>Grafikdesignerin</option><option>Lektorin</option></select>
</header>
<div class="kpis" id="kpis"></div>
<main><div id="view"></div></main>
<aside id="drawer"></aside>

<script>
const STAGES=[[10,"In Vorbereitung / Erstkontakt"],[25,"Im Gespräch / Angebot"],[40,"Zusage erteilt"],[50,"Abschluss / Gebucht"],[60,"Asset-Eingang"],[70,"Textkorrektur erfolgt"],[80,"Bild- & Layoutprüfung"],[90,"Kundenfreigabe erfolgt"],[100,"Druckfreigabe intern"]];
const ASSETS=[["text","Text"],["logo","Logo"],["fotos","Fotos (300 DPI)"],["entwurf","Grafik-Entwurf"]];
const D=(d)=>d; // Demodaten
const ADS=[
 {id:1,kunde:"Bäckerei Hoffmann",format:"1/2 Seite",ausgabe:"Sommer 2024",pct:10,wer:"Akquise",warte:"Chefin: Erstgespräch vereinbaren",tage:2,kontakt:"Anna Hoffmann · 0621 555 101 · a.hoffmann@baeckerei-hoffmann.example",assets:{},notiz:"Empfehlung vom Stadtfest.",hist:["03.06. Lead aufgenommen"]},
 {id:2,kunde:"Autohaus Brenner",format:"Umschlagseite",ausgabe:"Sommer 2024",pct:25,wer:"Kunde",warte:"Wartet auf Rückmeldung zum Angebot",tage:9,kontakt:"Jens Brenner · 0621 555 202",assets:{},notiz:"Preis zu hoch? Alternativ 1/1 Innenseite anbieten.",hist:["20.05. Angebot versendet","29.05. Nachfassen per Telefon"]},
 {id:3,kunde:"Weingut Rebstock",format:"1/1 Seite",ausgabe:"Sommer 2024",pct:40,wer:"Kunde",warte:"Wartet auf Vertragsunterschrift",tage:4,kontakt:"Marie Stock · m.stock@rebstock.example",assets:{},notiz:"Mündliche Zusage am Telefon.",hist:["28.05. Zusage erteilt"]},
 {id:4,kunde:"Zahnarztpraxis Dr. Lenz",format:"1/4 Seite",ausgabe:"Sommer 2024",pct:50,wer:"Kunde",warte:"Wartet auf Assets vom Kunden",tage:12,kontakt:"Praxis Lenz · 0621 555 404",assets:{},notiz:"Liefertermin 10.06. – bereits überfällig.",hist:["24.05. Buchung bestätigt","03.06. Erinnerung gesendet"]},
 {id:5,kunde:"Sanitär Krause",format:"1/2 Seite",ausgabe:"Sommer 2024",pct:60,wer:"Lektorat",warte:"Wartet auf Lektorat",tage:3,kontakt:"Peter Krause · 0621 555 505",assets:{text:1,logo:1},notiz:"Fotos fehlen noch, Text kann schon geprüft werden.",hist:["31.05. Text + Logo eingegangen"]},
 {id:6,kunde:"Blumen Maier",format:"1/4 Seite",ausgabe:"Sommer 2024",pct:70,wer:"Grafik",warte:"Wartet auf Bild- & Layoutprüfung",tage:1,kontakt:"Sabine Maier · 0621 555 606",assets:{text:1,logo:1,fotos:1},notiz:"Fotos evtl. nur 150 DPI – prüfen.",hist:["01.06. Lektorat OK"]},
 {id:7,kunde:"Fitnessstudio Vital",format:"1/1 Seite",ausgabe:"Sommer 2024",pct:80,wer:"Kunde",warte:"Wartet auf Kundenfreigabe",tage:6,kontakt:"Tom Vital · 0621 555 707",assets:{text:1,logo:1,fotos:1,entwurf:1},notiz:"Korrekturabzug am 02.06. versendet.",hist:["02.06. Abzug versendet"]},
 {id:8,kunde:"Stadtwerke Süd",format:"Umschlagseite",ausgabe:"Sommer 2024",pct:90,wer:"Verlag",warte:"Intern: Druckfreigabe erteilen",tage:0,kontakt:"Frau Winter · 0621 555 808",assets:{text:1,logo:1,fotos:1,entwurf:1},notiz:"Kunde hat abgezeichnet.",hist:["05.06. Kundenfreigabe"]},
 {id:9,kunde:"Eiscafé Venezia",format:"1/2 Seite",ausgabe:"Sommer 2024",pct:100,wer:"–",warte:"Fertig – an Druckerei übergeben",tage:0,kontakt:"Luca Rossi · 0621 555 909",assets:{text:1,logo:1,fotos:1,entwurf:1},notiz:"",hist:["06.06. Druckfreigabe"]},
 {id:10,kunde:"Reisebüro Fernweh",format:"1/4 Seite",ausgabe:"Herbst 2024",pct:25,wer:"Akquise",warte:"Angebot nachfassen",tage:5,kontakt:"Karin Weber · 0621 555 111",assets:{},notiz:"",hist:["01.06. Angebot versendet"]},
 {id:11,kunde:"Schreinerei Holz & Form",format:"1/2 Seite",ausgabe:"Herbst 2024",pct:60,wer:"Lektorat",warte:"Wartet auf Lektorat",tage:8,kontakt:"Max Holz · 0621 555 222",assets:{text:1,logo:1},notiz:"",hist:["28.05. Assets eingegangen"]}
];
const $=s=>document.querySelector(s);
const color=p=>p<50?"var(--p1)":"var(--p2)";
const blocked=a=>a.tage>=7&&a.pct<100;
let view="k";
const ausgaben=[...new Set(ADS.map(a=>a.ausgabe))];
$("#fIssue").innerHTML='<option value="">Alle Ausgaben</option>'+ausgaben.map(x=>`<option>${x}</option>`).join("");
$("#fStatus").innerHTML='<option value="">Alle Status</option><option value="p1">Phase 1 · Vertrieb (0–50 %)</option><option value="p2">Phase 2 · Produktion (50–100 %)</option>'+STAGES.map(s=>`<option value="${s[0]}">${s[0]} % – ${s[1]}</option>`).join("");
function filtered(){
  const i=$("#fIssue").value,s=$("#fStatus").value,r=$("#fRole").value,b=$("#fBlock").checked;
  return ADS.filter(a=>(!i||a.ausgabe===i)&&(!r||a.wer===r)&&(!b||blocked(a))&&(!s||(s==="p1"?a.pct<=50:s==="p2"?a.pct>50:a.pct==s)));
}
const chk=a=>`<div class="chk">${ASSETS.map(([k,l])=>`<span class="${a.assets[k]?'d':''}">${a.assets[k]?'✓':'○'} ${l.split(' ')[0]}</span>`).join("")}</div>`;
const whoTag=a=>a.pct===100?'<span class="tag go">Fertig</span>':`<span class="tag ${blocked(a)?'bad':''}">${blocked(a)?'⚠ ':''}${a.warte}</span>`;
function card(a){return `<div class="card ${blocked(a)?'blocked':a.pct===100?'ok':''}" onclick="openD(${a.id})"><div class="n">${a.kunde}</div><div class="m">${a.format} · ${a.ausgabe}</div><div class="bar"><i style="width:${a.pct}%;background:${color(a.pct)}"></i></div>${whoTag(a)}${a.tage&&a.pct<100?`<div class="m">seit ${a.tage} Tagen</div>`:''}${a.pct>=50?chk(a):''}</div>`}
function render(){
  const L=filtered();
  const all=ADS.length,bl=ADS.filter(blocked).length,avg=Math.round(ADS.reduce((s,a)=>s+a.pct,0)/all);
  const wk=ADS.filter(a=>a.wer==="Kunde"&&a.pct<100).length;
  $("#kpis").innerHTML=`<div class="kpi"><b>${all}</b><span>Anzeigen gesamt</span></div><div class="kpi"><b>${avg} %</b><span>Ø Fortschritt</span></div><div class="kpi"><b>${wk}</b><span>Warten auf Kunde</span></div><div class="kpi bad"><b>${bl}</b><span>Engpässe (≥ 7 Tage)</span></div><div class="kpi"><b>${ADS.filter(a=>a.pct===100).length}</b><span>Druckfertig</span></div>`;
  if(view==="k"){
    $("#view").innerHTML=`<div class="board">${STAGES.map(([p,t])=>{const c=L.filter(a=>a.pct===p);return `<div class="col"><h3><span>${p} % · ${t}</span><span>${c.length}</span></h3>${c.map(card).join("")}</div>`}).join("")}</div>`;
  }else{
    $("#view").innerHTML=`<div class="scroll"><table><tr><th>Kunde</th><th>Format</th><th>Ausgabe</th><th>Fortschritt</th><th>Am Zug</th><th>Assets</th></tr>${L.map(a=>`<tr class="r" onclick="openD(${a.id})"><td><b>${a.kunde}</b></td><td>${a.format}</td><td>${a.ausgabe}</td><td><div class="bar"><i style="width:${a.pct}%;background:${color(a.pct)}"></i></div>${a.pct} % · ${STAGES.find(s=>s[0]===a.pct)[1]}</td><td>${whoTag(a)}</td><td>${a.pct>=50?chk(a):'–'}</td></tr>`).join("")}</table></div>`;
  }
}
function openD(id){
  const a=ADS.find(x=>x.id===id);
  $("#drawer").innerHTML=`<button class="x" onclick="closeD()">✕</button><h2>${a.kunde}</h2><div class="m role">${a.format} · ${a.ausgabe}</div>
  <div class="bar" style="height:12px"><i style="width:${a.pct}%;background:${color(a.pct)}"></i></div><b>${a.pct} %</b> – ${STAGES.find(s=>s[0]===a.pct)[1]}<div style="margin-top:8px">${whoTag(a)}</div>
  <h4>Status ändern</h4><select onchange="setPct(${a.id},+this.value)">${STAGES.map(s=>`<option value="${s[0]}" ${s[0]===a.pct?'selected':''}>${s[0]} % – ${s[1]}</option>`).join("")}</select>
  <h4>Asset-Checkliste</h4>${ASSETS.map(([k,l])=>`<label class="row"><input type="checkbox" ${a.assets[k]?'checked':''} onchange="setAsset(${a.id},'${k}',this.checked)"> ${l}</label>`).join("")}
  <h4>Kontakt</h4><div>${a.kontakt}</div>
  <h4>Notizen</h4><textarea onchange="ADS.find(x=>x.id===${a.id}).notiz=this.value">${a.notiz}</textarea>
  <h4>Historie</h4><ul class="hist">${a.hist.slice().reverse().map(h=>`<li>${h}</li>`).join("")}</ul>
  <div class="row"><button onclick="alert('Mockup: Erinnerung an ${a.kunde} gesendet.')">📧 Kunden erinnern</button></div>`;
  $("#drawer").classList.add("open");
}
function closeD(){$("#drawer").classList.remove("open")}
function setPct(id,p){const a=ADS.find(x=>x.id===id);a.pct=p;a.tage=0;a.hist.push(new Date().toLocaleDateString("de-DE")+" Status → "+p+" %");openD(id);render()}
function setAsset(id,k,v){const a=ADS.find(x=>x.id===id);a.assets[k]=v?1:0;a.hist.push(new Date().toLocaleDateString("de-DE")+" Asset "+k+(v?" erhalten":" entfernt"));render()}
["fIssue","fStatus","fRole","fBlock"].forEach(i=>$("#"+i).onchange=render);
$("#vK").onclick=()=>{view="k";$("#vK").className="on";$("#vL").className="";render()};
$("#vL").onclick=()=>{view="l";$("#vL").className="on";$("#vK").className="";render()};
$("#persona").onchange=e=>{const m={"Chefin / Akquise":"Akquise","Grafikdesignerin":"Grafik","Lektorin":"Lektorat"};$("#fRole").value=e.target.value==="Chefin / Akquise"?"":m[e.target.value];render()};
render();
</script>
</body>
</html>
